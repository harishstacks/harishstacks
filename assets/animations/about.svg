<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 440" width="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Backgrounds -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#040509"/>
      <stop offset="50%"  stop-color="#0a0b16"/>
      <stop offset="100%" stop-color="#040509"/>
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <linearGradient id="card-border-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="card-border-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff00ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff00ff" stop-opacity="0.12"/>
    </linearGradient>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1500" height="440" fill="url(#bg)" rx="10"/>
  <rect width="1500" height="440" fill="url(#grid)" rx="10"/>

  <!-- Top Decorative HUD Corner Lines -->
  <path d="M 50 42 L 50 25 L 67 25" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.45"/>
  <path d="M 1450 42 L 1450 25 L 1433 25" fill="none" stroke="#ff00ff" stroke-width="1.5" stroke-opacity="0.45"/>
  <path d="M 50 398 L 50 415 L 67 415" fill="none" stroke="#ff00ff" stroke-width="1.5" stroke-opacity="0.45"/>
  <path d="M 1450 398 L 1450 415 L 1433 415" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Header Banner Section -->
  <g transform="translate(55, 30)">
    <!-- Subtitle Tag -->
    <text x="0" y="14" fill="#00f0ff" font-family="'JetBrains Mono',Monaco,Consolas,monospace" font-size="10" letter-spacing="2" opacity="0.75">// SYSTEM.PROFILE :: ABOUT_ME</text>
    
    <!-- Main Title -->
    <text x="0" y="46" fill="#ffffff" font-family="'JetBrains Mono',Monaco,Consolas,monospace" font-size="25" font-weight="bold">👋 Hi, I'm <tspan fill="url(#cyan-grad)">Harish M</tspan></text>

    <!-- Role Pills Row -->
    <g transform="translate(0, 62)">
      <!-- Pill 1: Student -->
      <rect x="0" y="0" width="230" height="28" rx="14" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1"/>
      <text x="14" y="18" fill="#e2e8f0" font-family="'JetBrains Mono',Monaco,Consolas,monospace" font-size="11">🎓 AI &amp; Data Science Student</text>

      <!-- Pill 2: Python Dev -->
      <rect x="242" y="0" width="170" height="28" rx="14" fill="#9d4edd" fill-opacity="0.08" stroke="#9d4edd" stroke-opacity="0.3" stroke-width="1"/>
      <text x="256" y="18" fill="#e2e8f0" font-family="'JetBrains Mono',Monaco,Consolas,monospace" font-size="11">💻 Python Developer</text>

      <!-- Pill 3: ML Enthusiast -->
      <rect x="424" y="0" width="240" height="28" rx="14" fill="#ff00ff" fill-opacity="0.08" stroke="#ff00ff" stroke-opacity="0.3" stroke-width="1"/>
      <text x="438" y="18" fill="#e2e8f0" font-family="'JetBrains Mono',Monaco,Consolas,monospace" font-size="11">🤖 Machine Learning Enthusiast</text>

      <!-- Pill 4: UI/UX Designer -->
      <rect x="676" y="0" width="160" height="28" rx="14" fill="#39ff14" fill-opacity="0.08" stroke="#39ff14" stroke-opacity="0.3" stroke-width="1"/>
      <text x="690" y="18" fill="#e2e8f0" font-family="'JetBrains Mono',Monaco,Consolas,monospace" font-size="11">🎨 UI/UX Designer</text>
    </g>
  </g>

  <!-- COLUMN 1: Currently Learning (x=55, y=155, w=680, h=245) -->
  <g transform="translate(55, 155)">
    <!-- Card Background -->
    <rect x="0" y="0" width="680" height="245" rx="8" fill="#070913" fill-opacity="0.92" stroke="url(#card-border-cyan)" stroke-width="1.5"/>
    
    <!-- Card Header -->
    <line x1="0" y1="42" x2="680" y2="42" stroke="#00f0ff" stroke-opacity="0.2" stroke-width="1"/>
    <circle cx="22" cy="22" r="4.5" fill="#00f0ff" filter="url(#glow-cyan)"/>
    <text x="36" y="26" fill="#00f0ff" font-family="'JetBrains Mono',Monaco,Consolas,monospace" font-size="12.5" font-weight="bold" letter-spacing="1.5">📚 CURRENTLY LEARNING</text>

    <!-- Content Items -->
    <g font-family="'JetBrains Mono',Monaco,Consolas,monospace" font-size="12.5" fill="#e2e8f0">
      <!-- Item 1 -->
      <g transform="translate(25, 72)">
        <polygon points="0,0 7,-4 7,4" fill="#00f0ff"/>
        <text x="18" y="4">AI <tspan fill="#718096" font-size="10.5">// Artificial Intelligence</tspan></text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(25, 104)">
        <polygon points="0,0 7,-4 7,4" fill="#00f0ff"/>
        <text x="18" y="4">Machine Learning <tspan fill="#718096" font-size="10.5">// Supervised &amp; Unsupervised Models</tspan></text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(25, 136)">
        <polygon points="0,0 7,-4 7,4" fill="#00f0ff"/>
        <text x="18" y="4">Deep Learning <tspan fill="#718096" font-size="10.5">// Neural Networks &amp; PyTorch</tspan></text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(25, 168)">
        <polygon points="0,0 7,-4 7,4" fill="#00f0ff"/>
        <text x="18" y="4">Data Science <tspan fill="#718096" font-size="10.5">// Analytics &amp; Visualization</tspan></text>
      </g>
      <!-- Item 5 -->
      <g transform="translate(25, 200)">
        <polygon points="0,0 7,-4 7,4" fill="#00f0ff"/>
        <text x="18" y="4">Full Stack Development <tspan fill="#718096" font-size="10.5">// Modern Web Systems</tspan></text>
      </g>
    </g>
  </g>

  <!-- COLUMN 2: Goals (x=765, y=155, w=680, h=245) -->
  <g transform="translate(765, 155)">
    <!-- Card Background -->
    <rect x="0" y="0" width="680" height="245" rx="8" fill="#070913" fill-opacity="0.92" stroke="url(#card-border-pink)" stroke-width="1.5"/>
    
    <!-- Card Header -->
    <line x1="0" y1="42" x2="680" y2="42" stroke="#ff00ff" stroke-opacity="0.2" stroke-width="1"/>
    <circle cx="22" cy="22" r="4.5" fill="#ff00ff" filter="url(#glow-pink)"/>
    <text x="36" y="26" fill="#ff00ff" font-family="'JetBrains Mono',Monaco,Consolas,monospace" font-size="12.5" font-weight="bold" letter-spacing="1.5">🎯 GOALS &amp; OBJECTIVES</text>

    <!-- Content Items -->
    <g font-family="'JetBrains Mono',Monaco,Consolas,monospace" font-size="12.5" fill="#e2e8f0">
      <!-- Item 1 -->
      <g transform="translate(25, 78)">
        <circle cx="3" cy="0" r="3" fill="#ff00ff" filter="url(#glow-pink)"/>
        <text x="18" y="4">Become an AI Engineer</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(25, 122)">
        <circle cx="3" cy="0" r="3" fill="#ff00ff" filter="url(#glow-pink)"/>
        <text x="18" y="4">Build impactful open-source projects</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(25, 166)">
        <circle cx="3" cy="0" r="3" fill="#ff00ff" filter="url(#glow-pink)"/>
        <text x="18" y="4">Contribute to the AI community</text>
      </g>
    </g>
  </g>
</svg>
