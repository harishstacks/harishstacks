<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HARISH OS — AI Command Center Preview (1500×370)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #060812;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'JetBrains Mono', monospace;
      color: #e2e8f0;
      padding: 40px 24px;
      gap: 20px;
    }

    .label {
      font-size: 9.5px;
      letter-spacing: 2.5px;
      color: #64748b;
      text-transform: uppercase;
    }
    .label span { color: #00d2ff; }

    .banner {
      width: 100%;
      max-width: 1500px;
      aspect-ratio: 1500 / 370;
      border-radius: 10px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(0,210,255,.08),
        0 0 50px rgba(0,210,255,.05),
        0 0 25px rgba(112,0,255,.06),
        0 28px 80px rgba(0,0,0,.8);
    }

    .banner svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .meta {
      display: flex;
      gap: 28px;
      font-size: 9px;
      color: #64748b;
      letter-spacing: 1px;
    }
    .meta span { color: #9d4edd; }
  </style>
</head>
<body>

  <div class="label">// AI WORKSTATION — <span>1500 × 370</span></div>

  <div class="banner">
    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 1500 370"
         width="100%" height="100%"
         preserveAspectRatio="xMidYMid meet">

      <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#060812"/>
          <stop offset="50%"  stop-color="#090d1a"/>
          <stop offset="100%" stop-color="#050710"/>
        </linearGradient>

        <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#00d2ff" stop-opacity="0.6"/>
          <stop offset="50%"  stop-color="#7000ff" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.15"/>
        </linearGradient>

        <linearGradient id="header-line" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#00d2ff" stop-opacity="0.8"/>
          <stop offset="50%"  stop-color="#7000ff" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.0"/>
        </linearGradient>

        <radialGradient id="glow-left" cx="20%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#00d2ff" stop-opacity="0.09"/>
          <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glow-right" cx="80%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#7000ff" stop-opacity="0.10"/>
          <stop offset="100%" stop-color="#7000ff" stop-opacity="0"/>
        </radialGradient>

        <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
          <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00d2ff" stroke-width="0.5" stroke-opacity="0.025"/>
        </pattern>

        <filter id="soft-glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="soft-glow-purple" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00d2ff" flood-opacity="0.08"/>
        </filter>

        <clipPath id="cl1"><rect id="rl1" x="72" y="93"  width="0" height="22"/></clipPath>
        <clipPath id="cl2"><rect id="rl2" x="72" y="112" width="0" height="22"/></clipPath>
        <clipPath id="cl3"><rect id="rl3" x="72" y="134" width="0" height="22"/></clipPath>
        <clipPath id="cl4"><rect id="rl4" x="72" y="153" width="0" height="22"/></clipPath>
        <clipPath id="cl5"><rect id="rl5" x="72" y="175" width="0" height="22"/></clipPath>
        <clipPath id="cl6"><rect id="rl6" x="72" y="194" width="0" height="22"/></clipPath>
        <clipPath id="cl7"><rect id="rl7" x="72" y="216" width="0" height="22"/></clipPath>
        <clipPath id="cl8"><rect id="rl8" x="72" y="235" width="0" height="22"/></clipPath>
        <clipPath id="cl9"><rect id="rl9" x="72" y="257" width="0" height="22"/></clipPath>
        <clipPath id="cl10"><rect id="rl10" x="72" y="276" width="0" height="22"/></clipPath>
      </defs>

      <style>
        @keyframes pulse-slow{0%,100%{opacity:.4}50%{opacity:.95}}
        .status-pulse{animation:pulse-slow 2.5s ease-in-out infinite}

        @keyframes wave-anim{0%{stroke-dashoffset:320}100%{stroke-dashoffset:0}}
        .neural-wave{stroke-dasharray:80 240;animation:wave-anim 4.5s linear infinite}

        @keyframes gpu-pf{0%,100%{stroke-dashoffset:45}50%{stroke-dashoffset:18}}
        .gpu-ring{transform-origin:1345px 150px;transform:rotate(-90deg);animation:gpu-pf 4s ease-in-out infinite}

        @keyframes prog-glow{0%,100%{opacity:.85}50%{opacity:1}}
        .prog-fill{animation:prog-glow 2s ease-in-out infinite}

        @keyframes tl1 {0%,1%{width:0} 7%,93%{width:260px} 97%,100%{width:0}}
        @keyframes tl2 {0%,8%{width:0} 14%,93%{width:180px} 97%,100%{width:0}}
        @keyframes tl3 {0%,15%{width:0} 21%,93%{width:240px} 97%,100%{width:0}}
        @keyframes tl4 {0%,22%{width:0} 28%,93%{width:310px} 97%,100%{width:0}}
        @keyframes tl5 {0%,29%{width:0} 35%,93%{width:260px} 97%,100%{width:0}}
        @keyframes tl6 {0%,36%{width:0} 42%,93%{width:440px} 97%,100%{width:0}}
        @keyframes tl7 {0%,43%{width:0} 49%,93%{width:360px} 97%,100%{width:0}}
        @keyframes tl8 {0%,50%{width:0} 56%,93%{width:350px} 97%,100%{width:0}}
        @keyframes tl9 {0%,57%{width:0} 63%,93%{width:260px} 97%,100%{width:0}}
        @keyframes tl10{0%,64%{width:0} 72%,93%{width:420px} 97%,100%{width:0}}

        #rl1 {animation:tl1 14s linear infinite}
        #rl2 {animation:tl2 14s linear infinite}
        #rl3 {animation:tl3 14s linear infinite}
        #rl4 {animation:tl4 14s linear infinite}
        #rl5 {animation:tl5 14s linear infinite}
        #rl6 {animation:tl6 14s linear infinite}
        #rl7 {animation:tl7 14s linear infinite}
        #rl8 {animation:tl8 14s linear infinite}
        #rl9 {animation:tl9 14s linear infinite}
        #rl10{animation:tl10 14s linear infinite}

        @keyframes cursor-move {
          0%,1%   {x:72px;y:95px;opacity:1}
          7%      {x:332px;y:95px;opacity:1}  8%  {x:72px;y:114px;opacity:1}
          14%     {x:252px;y:114px;opacity:1} 15% {x:72px;y:136px;opacity:1}
          21%     {x:312px;y:136px;opacity:1} 22% {x:72px;y:155px;opacity:1}
          28%     {x:382px;y:155px;opacity:1} 29% {x:72px;y:177px;opacity:1}
          35%     {x:332px;y:177px;opacity:1} 36% {x:72px;y:196px;opacity:1}
          42%     {x:512px;y:196px;opacity:1} 43% {x:72px;y:218px;opacity:1}
          49%     {x:432px;y:218px;opacity:1} 50% {x:72px;y:237px;opacity:1}
          56%     {x:422px;y:237px;opacity:1} 57% {x:72px;y:259px;opacity:1}
          63%     {x:332px;y:259px;opacity:1} 64% {x:72px;y:278px;opacity:1}
          72%     {x:492px;y:278px;opacity:1}
          74%,92% {opacity:1} 94%,100%{opacity:0}
        }
        .term-cursor{animation:cursor-move 14s linear infinite}
      </style>

      <!-- Background -->
      <rect width="1500" height="370" fill="url(#bg)"/>
      <rect width="1500" height="370" fill="url(#grid)"/>
      <circle cx="300"  cy="185" r="450" fill="url(#glow-left)"/>
      <circle cx="1200" cy="185" r="450" fill="url(#glow-right)"/>

      <!-- HUD Frame -->
      <g>
        <path d="M 50,50 L 50,35 L 65,35"     fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.4"/>
        <path d="M 1450,50 L 1450,35 L 1435,35" fill="none" stroke="#7000ff" stroke-width="1.5" stroke-opacity="0.4"/>
        <path d="M 50,320 L 50,335 L 65,335"   fill="none" stroke="#7000ff" stroke-width="1.5" stroke-opacity="0.4"/>
        <path d="M 1450,320 L 1450,335 L 1435,335" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.4"/>

        <text x="76" y="28" fill="#00d2ff" font-family="'JetBrains Mono',monospace" font-size="9" opacity="0.5" letter-spacing="1.5">SYS.ID // AI.RESEARCH.NODE-01</text>
        <text x="1424" y="28" text-anchor="end" fill="#9d4edd" font-family="'JetBrains Mono',monospace" font-size="9" opacity="0.5" letter-spacing="1.5">ENV // PYTORCH 2.3 • CUDA 12.2</text>
        <line x1="50" y1="40" x2="160" y2="40" stroke="#00d2ff" stroke-width="1" opacity="0.18"/>
        <line x1="1340" y1="40" x2="1450" y2="40" stroke="#9d4edd" stroke-width="1" opacity="0.18"/>

        <text x="76" y="347" fill="#7000ff" font-family="'JetBrains Mono',monospace" font-size="8" opacity="0.4" letter-spacing="1.2">MODEL.VER // v3.4.0-DEEP-LEARNING</text>
        <text x="1424" y="347" text-anchor="end" fill="#00d2ff" font-family="'JetBrains Mono',monospace" font-size="8" opacity="0.4" letter-spacing="1.2">WORKSTATION // READY</text>
      </g>

      <!-- Panel 1: Terminal -->
      <g filter="url(#card-shadow)">
        <rect x="55" y="45" width="840" height="280" rx="10" fill="#080c19" fill-opacity="0.94"/>
        <rect x="55" y="45" width="840" height="280" rx="10" fill="none" stroke="url(#glass-border)" stroke-width="1.2"/>
      </g>

      <g>
        <line x1="55" y1="78" x2="895" y2="78" stroke="url(#header-line)" stroke-width="1" opacity="0.3"/>
        <circle cx="78"  cy="62" r="4" fill="#ff5f56" opacity="0.85"/>
        <circle cx="92"  cy="62" r="4" fill="#ffbd2e" opacity="0.85"/>
        <circle cx="106" cy="62" r="4" fill="#27c93f" opacity="0.85"/>
        <text x="475" y="65" text-anchor="middle" fill="#7a8b9e" font-family="'JetBrains Mono',monospace" font-weight="600" font-size="9.5" letter-spacing="1">harish@ai-workstation:~</text>
        <circle class="status-pulse" cx="875" cy="62" r="3" fill="#00e676" filter="url(#soft-glow-cyan)"/>
      </g>

      <g font-family="'JetBrains Mono',monospace" font-size="11.5">
        <text x="72" y="107" fill="#e2e8f0" clip-path="url(#cl1)"><tspan fill="#00d2ff">harish</tspan><tspan fill="#7000ff">@</tspan><tspan fill="#00f0ff">ai-workstation</tspan><tspan fill="#5f6c7b">:~$ </tspan><tspan fill="#ffffff" font-weight="bold">whoami</tspan></text>
        <text x="72" y="125" fill="#e2e8f0" clip-path="url(#cl2)"><tspan fill="#00d2ff">&gt; </tspan><tspan fill="#ffffff" font-weight="bold">Harish M</tspan></text>

        <text x="72" y="147" fill="#e2e8f0" clip-path="url(#cl3)"><tspan fill="#00d2ff">harish</tspan><tspan fill="#7000ff">@</tspan><tspan fill="#00f0ff">ai-workstation</tspan><tspan fill="#5f6c7b">:~$ </tspan><tspan fill="#ffffff" font-weight="bold">role</tspan></text>
        <text x="72" y="165" fill="#e2e8f0" clip-path="url(#cl4)"><tspan fill="#00d2ff">&gt; </tspan><tspan fill="#00f0ff" font-weight="bold">AI &amp; Data Science Student</tspan></text>

        <text x="72" y="187" fill="#e2e8f0" clip-path="url(#cl5)"><tspan fill="#00d2ff">harish</tspan><tspan fill="#7000ff">@</tspan><tspan fill="#00f0ff">ai-workstation</tspan><tspan fill="#5f6c7b">:~$ </tspan><tspan fill="#ffffff" font-weight="bold">skills</tspan></text>
        <text x="72" y="205" fill="#e2e8f0" clip-path="url(#cl6)"><tspan fill="#00d2ff">&gt; </tspan><tspan fill="#ffffff">Python</tspan><tspan fill="#5f6c7b"> • </tspan><tspan fill="#00d2ff">Machine Learning</tspan><tspan fill="#5f6c7b"> • </tspan><tspan fill="#9d4edd">Data Science</tspan><tspan fill="#5f6c7b"> • </tspan><tspan fill="#00e676">UI/UX</tspan></text>

        <text x="72" y="227" fill="#e2e8f0" clip-path="url(#cl7)"><tspan fill="#00d2ff">harish</tspan><tspan fill="#7000ff">@</tspan><tspan fill="#00f0ff">ai-workstation</tspan><tspan fill="#5f6c7b">:~$ </tspan><tspan fill="#ffffff" font-weight="bold">currently_learning</tspan></text>
        <text x="72" y="245" fill="#e2e8f0" clip-path="url(#cl8)"><tspan fill="#00d2ff">&gt; </tspan><tspan fill="#00f0ff">Deep Learning</tspan><tspan fill="#5f6c7b"> | </tspan><tspan fill="#9d4edd">Generative AI</tspan><tspan fill="#5f6c7b"> | </tspan><tspan fill="#00d2ff">MLOps</tspan></text>

        <text x="72" y="267" fill="#e2e8f0" clip-path="url(#cl9)"><tspan fill="#00d2ff">harish</tspan><tspan fill="#7000ff">@</tspan><tspan fill="#00f0ff">ai-workstation</tspan><tspan fill="#5f6c7b">:~$ </tspan><tspan fill="#ffffff" font-weight="bold">status</tspan></text>
        <text x="72" y="285" fill="#e2e8f0" clip-path="url(#cl10)"><tspan fill="#00d2ff">&gt; </tspan><tspan fill="#00e676" font-weight="bold">Building AI-powered applications...</tspan></text>
      </g>

      <rect class="term-cursor" width="7" height="13" fill="#00d2ff" rx="1" filter="url(#soft-glow-cyan)"/>

      <!-- Panel 2: AI Dashboard -->
      <g filter="url(#card-shadow)">
        <rect x="915" y="45" width="530" height="280" rx="10" fill="#080c19" fill-opacity="0.94"/>
        <rect x="915" y="45" width="530" height="280" rx="10" fill="none" stroke="url(#glass-border)" stroke-width="1.2"/>
      </g>

      <g>
        <line x1="915" y1="78" x2="1445" y2="78" stroke="url(#header-line)" stroke-width="1" opacity="0.3"/>
        <text x="1180" y="65" text-anchor="middle" fill="#00d2ff" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="9.5" letter-spacing="1.5">// AI COMMAND CENTER</text>
        <circle class="status-pulse" cx="938" cy="62" r="3.5" fill="#00e676" filter="url(#soft-glow-cyan)"/>
      </g>

      <g font-family="'JetBrains Mono',monospace">
        <text x="938" y="103" fill="#00e676" font-size="10.5" font-weight="bold">MODEL STATUS: ONLINE // READY</text>
        <text x="938" y="125" font-size="10"><tspan fill="#64748b">ENV:</tspan>  <tspan fill="#00d2ff">PyTorch 2.3 • CUDA 12.2</tspan></text>
        <text x="938" y="145" font-size="10"><tspan fill="#64748b">PROJECTS:</tspan>  <tspan fill="#9d4edd">LLM AGENTS • MLOPS PIPELINES</tspan></text>
      </g>

      <g transform="translate(1265, 95)">
        <rect x="0" y="0" width="155" height="42" rx="6" fill="#00d2ff" fill-opacity="0.08" stroke="#00d2ff" stroke-opacity="0.3" stroke-width="1"/>
        <text x="77" y="17" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono',monospace" font-size="8" font-weight="bold">ACCURACY</text>
        <text x="77" y="34" text-anchor="middle" fill="#00d2ff" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="bold" filter="url(#soft-glow-cyan)">98.6%</text>
      </g>

      <g transform="translate(1345, 178)">
        <circle cx="0" cy="0" r="26" fill="none" stroke="#12182b" stroke-width="4"/>
        <circle class="gpu-ring" cx="0" cy="0" r="26" fill="none" stroke="#00d2ff" stroke-width="4" stroke-dasharray="163.3" stroke-dashoffset="163.3" filter="url(#soft-glow-cyan)"/>
        <text x="0" y="-3" text-anchor="middle" fill="#00d2ff" font-family="'JetBrains Mono',monospace" font-size="8" font-weight="bold">GPU</text>
        <text x="0" y="9" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono',monospace" font-size="7.5">88%</text>
      </g>

      <g transform="translate(938, 160)">
        <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono',monospace" font-size="8.5" font-weight="bold">NEURAL NETWORK ACTIVITY</text>
        <path d="M 0,22 L 20,22 L 30,8 L 40,36 L 50,22 L 75,22 L 85,14 L 95,30 L 105,22 L 140,22 L 150,2 L 160,42 L 170,22 L 200,22 L 210,12 L 220,32 L 230,22 L 370,22" fill="none" stroke="#12182b" stroke-width="1.5"/>
        <path class="neural-wave" d="M 0,22 L 20,22 L 30,8 L 40,36 L 50,22 L 75,22 L 85,14 L 95,30 L 105,22 L 140,22 L 150,2 L 160,42 L 170,22 L 200,22 L 210,12 L 220,32 L 230,22 L 370,22" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.9" filter="url(#soft-glow-cyan)"/>
      </g>

      <g transform="translate(938, 225)">
        <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono',monospace" font-size="8.5" font-weight="bold">TRAINING PROGRESS</text>
        <text x="482" y="0" text-anchor="end" fill="#00d2ff" font-family="'JetBrains Mono',monospace" font-size="8.5" font-weight="bold">94.2% <tspan fill="#64748b" font-size="7.5">[Epoch 48/50]</tspan></text>
        <rect x="0" y="10" width="482" height="6" rx="3" fill="#12182b"/>
        <rect class="prog-fill" x="0" y="10" width="454" height="6" rx="3" fill="url(#header-line)" filter="url(#soft-glow-cyan)"/>
      </g>

      <g transform="translate(938, 268)">
        <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono',monospace" font-size="8.5">STATUS: <tspan fill="#00e676" font-weight="bold">Building AI-powered applications...</tspan></text>
      </g>

    </svg>
  </div>

  <div class="meta">
    <div>CANVAS <span>1500×370</span></div>
    <div>THEME <span>AI Command Center Matte Dark</span></div>
    <div>PANELS <span>Terminal (840px) + AI Dashboard (530px)</span></div>
  </div>

</body>
</html>
