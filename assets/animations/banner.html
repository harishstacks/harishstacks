<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HARISH OS — Banner Preview (1500×370)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0c0d18;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'JetBrains Mono', monospace;
      color: #e2e8f0;
      padding: 40px 24px;
      gap: 20px;
    }

    .label {
      font-size: 9.5px;
      letter-spacing: 2.5px;
      color: #4a5568;
      text-transform: uppercase;
    }
    .label span { color: #00f0ff; }

    /* Scales to full width, preserves 1500:370 ratio — never crops */
    .banner {
      width: 100%;
      max-width: 1500px;
      aspect-ratio: 1500 / 370;
      border-radius: 10px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(0,240,255,.06),
        0 0 50px rgba(0,240,255,.06),
        0 0 25px rgba(157,78,221,.08),
        0 28px 80px rgba(0,0,0,.7);
    }

    /* SVG fills the wrapper exactly */
    .banner svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .meta {
      display: flex;
      gap: 28px;
      font-size: 9px;
      color: #4a5568;
      letter-spacing: 1px;
    }
    .meta span { color: #9d4edd; }
  </style>
</head>
