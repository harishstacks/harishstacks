<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HARISH OS — Banner Preview (1500×400)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0c0d18;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'JetBrains Mono', monospace;
      color: #e2e8f0;
      padding: 50px 24px;
      gap: 20px;
    }

    .label {
      font-size: 9.5px;
      letter-spacing: 2.5px;
      color: #4a5568;
      text-transform: uppercase;
    }
    .label span { color: #00f0ff; }

    /* Scales to full width, preserves 1500:400 ratio — never crops */
    .banner {
      width: 100%;
      max-width: 1500px;
      aspect-ratio: 1500 / 400;
      border-radius: 10px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(0,240,255,.06),
        0 0 50px rgba(0,240,255,.06),
        0 0 25px rgba(157,78,221,.08),
        0 28px 80px rgba(0,0,0,.7);
    }

    /* SVG fills the wrapper exactly */
    .banner svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .meta {
      display: flex;
      gap: 28px;
      font-size: 9px;
      color: #4a5568;
      letter-spacing: 1px;
    }
    .meta span { color: #9d4edd; }
  </style>
</head>
<body>

  <div class="label">// BANNER PREVIEW — <span>1500 × 400</span></div>

  <div class="banner">

      <defs>

          <stop offset="50%"  stop-color="#0a0b16"/>
          <stop offset="100%" stop-color="#040509"/>

        <linearGradient id="pb" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#00f0ff"/>
          <stop offset="50%"  stop-color="#9d4edd"/>
          <stop offset="100%" stop-color="#ff00ff"/>
        </linearGradient>
        <radialGradient id="gc" cx="20%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#00f0ff" stop-opacity="0.13"/>
          <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="gp" cx="80%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#9d4edd" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#9d4edd" stop-opacity="0"/>
        </radialGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M40 0L0 0 0 40" fill="none" stroke="#00f0ff" stroke-width="0.6" stroke-opacity="0.03"/>
        </pattern>
        <filter id="fc" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b1"/>
          <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b2"/>
          <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="fp" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b1"/>
          <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b2"/>
          <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="fg" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b1"/>
          <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b2"/>
          <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="fpl" x="-12%" y="-12%" width="124%" height="124%">
          <feDropShadow dx="0" dy="6"  stdDeviation="12" flood-color="#9d4edd" flood-opacity="0.20"/>
          <feDropShadow dx="0" dy="2"  stdDeviation="4"  flood-color="#00f0ff" flood-opacity="0.10"/>
        </filter>

        <clipPath id="cl1"><rect id="rl1" x="72" y="116" width="0" height="22"/></clipPath>
        <clipPath id="cl2"><rect id="rl2" x="72" y="143" width="0" height="22"/></clipPath>
        <clipPath id="cl3"><rect id="rl3" x="72" y="170" width="0" height="22"/></clipPath>
        <clipPath id="cl4"><rect id="rl4" x="72" y="197" width="0" height="22"/></clipPath>
        <clipPath id="cl5"><rect id="rl5" x="72" y="224" width="0" height="22"/></clipPath>
        <clipPath id="cl6"><rect id="rl6" x="72" y="251" width="0" height="22"/></clipPath>
        <clipPath id="cl7"><rect id="rl7" x="72" y="278" width="0" height="22"/></clipPath>

        @keyframes osc{0%{stroke-dashoffset:300}100%{stroke-dashoffset:0}}

        .b5{animation:bg1 1.3s ease-in-out infinite;animation-delay:.4s}

        #rl3{animation:tl3 14s linear infinite}
        #rl4{animation:tl4 14s linear infinite}
        #rl5{animation:tl5 14s linear infinite}
