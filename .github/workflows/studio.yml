name: Nightly studio

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate studio wall
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python generate_studio.py

      - name: Commit mural if it changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: install tonight's studio wall"
          file_pattern: studio.svg inspect.svg
