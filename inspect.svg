<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" width="1200" height="1080" role="img">
  <title>Harish M — inspect / filing plate</title>
  <desc>Product spec for Harish M as a system: intended use, training data, architecture, limitations, evaluation.</desc>
  <defs>
    <linearGradient id="bath2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a3a68"/>
      <stop offset="100%" stop-color="#04101c"/>
    </linearGradient>
    <filter id="chem2">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.28  0 0 0 0 0.42  0 0 0 0.18 0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect width="1200" height="1080" fill="url(#bath2)"/>
  <rect width="1200" height="1080" fill="#0a3a68" filter="url(#chem2)" opacity="0.4"/>
  <rect x="28" y="28" width="1144" height="1024" fill="none" stroke="#d7f2ea" stroke-width="0.6" opacity="0.25"/>
  <text x="72" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#ff5a32" letter-spacing="0.32em">FILING COPY</text>
  <text x="72" y="108" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="42" fill="#d7f2ea" font-weight="700" letter-spacing="-0.04em">Harish M</text>
  <text x="72" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6aa0a8">inspect  ·  2026-09-01T07:48:58Z  ·  seed ef7f8e3e</text>
  <text x="72" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#ff5a32" letter-spacing="0.16em">FIG.01  ·  INTENDED USE</text><text x="72" y="218" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#d7f2ea" opacity="0.9">Interface and model work in the same week. Farmer-facing product, forecasting from</text><text x="72" y="242" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#d7f2ea" opacity="0.9">tables, retention models. Seeking a data science or ML internship. Not a production ML</text><text x="72" y="266" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#d7f2ea" opacity="0.9">engineer of record.</text><text x="72" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#ff5a32" letter-spacing="0.16em">FIG.02  ·  TRAINING DATA</text><text x="72" y="344" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#d7f2ea" opacity="0.9">Coursework in AI and data science. Project hours, not a private corpus: Agro-Genix (crop</text><text x="72" y="368" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#d7f2ea" opacity="0.9">prices, storage booking), weather from historical records, telecom churn with class</text><text x="72" y="392" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#d7f2ea" opacity="0.9">imbalance, CV and OCR for shelf prices. Public commits only.</text><text x="72" y="448" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#ff5a32" letter-spacing="0.16em">FIG.03  ·  ARCHITECTURE</text><text x="72" y="470" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#d7f2ea" opacity="0.9">Two stacks on one meridian. Figma for structure and type. Python, pandas, scikit-learn</text><text x="72" y="494" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#d7f2ea" opacity="0.9">for the rest. Design decides what to measure. Models decide what the numbers allow.</text><text x="72" y="550" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#ff5a32" letter-spacing="0.16em">FIG.04  ·  LIMITATIONS</text><text x="72" y="572" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#d7f2ea" opacity="0.9">Student work. Churn and weather are classical ML. Agro-Genix is product-shaped HTML, not</text><text x="72" y="596" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#d7f2ea" opacity="0.9">a paper. No claim of production scale. Quiet weeks on this plate are empty on purpose.</text><text x="72" y="652" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#ff5a32" letter-spacing="0.16em">FIG.05  ·  EVALUATION</text><text x="72" y="674" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#d7f2ea" opacity="0.9">Good means a farmer can book storage without a tutorial; a forecast is honest about</text><text x="72" y="698" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#d7f2ea" opacity="0.9">error; a churn model names the features that actually move. The plate should read as</text><text x="72" y="722" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#d7f2ea" opacity="0.9">work, not a dashboard.</text><text x="72" y="786" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#ff5a32" letter-spacing="0.16em">FIG.06  ·  COMPONENTS</text><rect x="72" y="804" width="196" height="56" fill="#062033" stroke="#d7f2ea" stroke-width="0.8" opacity="0.95"/><circle cx="88" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="98" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="108" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="118" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="128" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><text x="84" y="836" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" fill="#d7f2ea">Figma</text><text x="84" y="850" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6aa0a8">structure, type, frames</text><rect x="280" y="804" width="196" height="56" fill="#062033" stroke="#d7f2ea" stroke-width="0.8" opacity="0.95"/><circle cx="296" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="306" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="316" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="326" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="336" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><text x="292" y="836" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" fill="#d7f2ea">Python</text><text x="292" y="850" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6aa0a8">runtime</text><rect x="488" y="804" width="196" height="56" fill="#062033" stroke="#d7f2ea" stroke-width="0.8" opacity="0.95"/><circle cx="504" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="514" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="524" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="534" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="544" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><text x="500" y="836" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" fill="#d7f2ea">pandas</text><text x="500" y="850" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6aa0a8">tables</text><rect x="696" y="804" width="196" height="56" fill="#062033" stroke="#d7f2ea" stroke-width="0.8" opacity="0.95"/><circle cx="712" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="722" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="732" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="742" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="752" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><text x="708" y="836" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" fill="#d7f2ea">scikit-learn</text><text x="708" y="850" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6aa0a8">estimators</text><rect x="904" y="804" width="196" height="56" fill="#062033" stroke="#d7f2ea" stroke-width="0.8" opacity="0.95"/><circle cx="920" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="930" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="940" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="950" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><circle cx="960" cy="814" r="2.1" fill="#04101c" stroke="#d7f2ea" stroke-width="0.6" opacity="0.7"/><text x="916" y="836" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" fill="#d7f2ea">OpenCV / OCR</text><text x="916" y="850" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6aa0a8">unpinned print</text>
  <text x="72" y="1044" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6aa0a8">now: IPL--auction  ·  2 punches this week</text>
