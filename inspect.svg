<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" width="1200" height="1080" role="img">
  <title>Harish M — inspect / model card</title>
  <desc>Product spec for Harish M as a system: intended use, training data, architecture, limitations, evaluation.</desc>
  <defs>
    <linearGradient id="wall2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a241c"/>
      <stop offset="100%" stop-color="#1f1b16"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1080" fill="url(#wall2)"/>
  <text x="72" y="88" font-family="Georgia, 'Times New Roman', Palatino, serif"
        font-size="36" fill="#e6ddd0">Harish M</text>
  <text x="72" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11" fill="#8a7f70">model card  ·  2026-08-29T14:03:11Z  ·  seed c19cab3e</text>
  <text x="72" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c4a06a" letter-spacing="0.12em">INTENDED USE</text><text x="72" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#e6ddd0" opacity="0.88">Interface and model work in the same week. Farmer-facing product, forecasting from</text><text x="72" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#e6ddd0" opacity="0.88">tables, retention models. Seeking a data science or ML internship. Not a production ML</text><text x="72" y="238" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#e6ddd0" opacity="0.88">engineer of record.</text><text x="72" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c4a06a" letter-spacing="0.12em">TRAINING DATA</text><text x="72" y="316" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#e6ddd0" opacity="0.88">Coursework in AI and data science. Project hours, not a private corpus: Agro-Genix (crop</text><text x="72" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#e6ddd0" opacity="0.88">prices, storage booking), weather from historical records, telecom churn with class</text><text x="72" y="364" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#e6ddd0" opacity="0.88">imbalance, CV and OCR for shelf prices. Public commits only.</text><text x="72" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c4a06a" letter-spacing="0.12em">ARCHITECTURE</text><text x="72" y="442" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#e6ddd0" opacity="0.88">Two stacks that share a wall. Figma for structure and type. Python, pandas, scikit-learn</text><text x="72" y="466" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#e6ddd0" opacity="0.88">for the rest. Design decides what to measure. Models decide what the numbers allow.</text><text x="72" y="522" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c4a06a" letter-spacing="0.12em">LIMITATIONS</text><text x="72" y="544" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#e6ddd0" opacity="0.88">Student work. Churn and weather are classical ML. Agro-Genix is product-shaped HTML, not</text><text x="72" y="568" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#e6ddd0" opacity="0.88">a paper. No claim of production scale. Quiet weeks on this wall are empty on purpose.</text><text x="72" y="624" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c4a06a" letter-spacing="0.12em">EVALUATION</text><text x="72" y="646" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#e6ddd0" opacity="0.88">Good means a farmer can book storage without a tutorial; a forecast is honest about</text><text x="72" y="670" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#e6ddd0" opacity="0.88">error; a churn model names the features that actually move. The wall should read as</text><text x="72" y="694" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#e6ddd0" opacity="0.88">work, not a dashboard.</text><text x="72" y="758" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c4a06a" letter-spacing="0.12em">COMPONENTS</text><rect x="72" y="776" width="196" height="52" fill="none" stroke="#c4a06a" stroke-width="0.8" opacity="0.45"/><text x="84" y="798" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#e6ddd0">Figma</text><text x="84" y="816" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8a7f70">structure, type, frames</text><rect x="280" y="776" width="196" height="52" fill="none" stroke="#c4a06a" stroke-width="0.8" opacity="0.45"/><text x="292" y="798" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#e6ddd0">Python</text><text x="292" y="816" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8a7f70">runtime</text><rect x="488" y="776" width="196" height="52" fill="none" stroke="#c4a06a" stroke-width="0.8" opacity="0.45"/><text x="500" y="798" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#e6ddd0">pandas</text><text x="500" y="816" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8a7f70">tables</text><rect x="696" y="776" width="196" height="52" fill="none" stroke="#c4a06a" stroke-width="0.8" opacity="0.45"/><text x="708" y="798" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#e6ddd0">scikit-learn</text><text x="708" y="816" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8a7f70">estimators</text><rect x="904" y="776" width="196" height="52" fill="none" stroke="#c4a06a" stroke-width="0.8" opacity="0.45"/><text x="916" y="798" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#e6ddd0">OpenCV / OCR</text><text x="916" y="816" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8a7f70">unpinned print</text>
  <text x="72" y="1044" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#8a7f70">currently: IPL--auction  ·  0 commits this week</text>
</svg>
